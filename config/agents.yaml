# Agent execution configuration [cite: 998]

defaults:
  timeout_seconds: 30
  max_retries: 3
  model: gpt-4-turbo

agents:
  claims:
    timeout_seconds: 45
    temperature: 0.2
  
  billing:
    timeout_seconds: 30
    temperature: 0.1
  
  scheduling:
    timeout_seconds: 30
    temperature: 0.3
