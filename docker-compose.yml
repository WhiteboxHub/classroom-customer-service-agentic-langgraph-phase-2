version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: xyz_postgres
    environment:
      POSTGRES_USER: xyz_user
      POSTGRES_PASSWORD: xyz_password
      POSTGRES_DB: xyz_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xyz_user -d xyz_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: xyz_redis
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    container_name: xyz_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  app:
    build: .
    container_name: xyz_agent_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://xyz_user:xyz_password@postgres:5432/xyz_db
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chromadb:
        condition: service_started
    volumes:
      - .:/app

volumes:
  postgres_data:
  chroma_data:
